name: Daily career-page collection
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-page-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python scripts/collect.py
      - run: python scripts/export_excel.py
      - name: Publish collection report
        run: cat public/data/collection-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save updated public research feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public internship research feed'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: internship-research
          path: |
            public/data/internships.xlsx
            public/data/collection-report.md
