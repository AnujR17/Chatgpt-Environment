name: Checkpoint Windows preview

on:
  push:
    branches: [topic/checkpoint]
    paths:
      - topics/checkpoint/app/checkpoint/**
      - topics/checkpoint/app/scripts/**
      - topics/checkpoint/app/requirements-runtime.txt
      - topics/checkpoint/app/artifacts/*.onnx
      - topics/checkpoint/app/artifacts/calibration.json
      - topics/checkpoint/app/design/windows-runtime-sources.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checkpoint-windows-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: topics/checkpoint/app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch the reviewed Windows runtime
        run: python -m scripts.fetch_windows_runtime
      - name: Check phone character JavaScript syntax
        run: node --check checkpoint/assets/nori-visual.js
      - name: Assemble native application
        run: python -m scripts.assemble_windows
      - name: Include instructions and test evidence
        run: |
          New-Item -ItemType Directory -Force build/Checkpoint-Windows/docs | Out-Null
          Copy-Item docs/WINDOWS-APP.md build/Checkpoint-Windows/docs/
          Copy-Item docs/PIP-COMPANION.md build/Checkpoint-Windows/docs/
          Copy-Item docs/IN-APP-UPDATES.md build/Checkpoint-Windows/docs/
          Copy-Item docs/EXPRESSIVE-PIP.md build/Checkpoint-Windows/docs/
          Copy-Item docs/NORI-REFLECTION-AND-CMA.md build/Checkpoint-Windows/docs/
          Copy-Item docs/REBUILD-RESEARCH-AND-PLAN.md build/Checkpoint-Windows/docs/
          Copy-Item docs/EXPRESSIONS-AND-GAME-STATE.md build/Checkpoint-Windows/docs/
          Copy-Item artifacts/reflection-replay.json build/Checkpoint-Windows/docs/
          Copy-Item artifacts/rebuild-model-comparison.json build/Checkpoint-Windows/docs/
          Copy-Item artifacts/rebuild-mobileface-comparison.json build/Checkpoint-Windows/docs/
          Copy-Item artifacts/reflection-video-smoke.json build/Checkpoint-Windows/docs/
          Copy-Item docs/CAMERA-AND-PHONE-TROUBLESHOOTING.md build/Checkpoint-Windows/docs/
          Copy-Item docs/VIDEO-AND-MODEL-RESEARCH.md build/Checkpoint-Windows/docs/
          Copy-Item artifacts/cards-app-tests.xml build/Checkpoint-Windows/docs/
          Copy-Item artifacts/windows-assembly-verification.json build/Checkpoint-Windows/docs/
      - name: Check native launch on Windows
        run: |
          Push-Location build/Checkpoint-Windows
          & ./runtime/python.exe ./launch.py --no-setup --screenshot ./windows-smoke.png
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows launch failed' }
          if (!(Test-Path ./windows-smoke.png)) { throw 'Native window screenshot missing' }
          Pop-Location
      - name: Check Windows live card and game-window capture fixtures
        run: |
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/smoke_windows_tracking.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows live tracking fixture checks failed' }
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path artifacts/firewall-command-check.ps1), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Phone firewall helper PowerShell syntax failed' }
          Copy-Item artifacts/windows-tracking-smoke.json build/Checkpoint-Windows/docs/
          Copy-Item artifacts/live-tracking-tests.xml build/Checkpoint-Windows/docs/
          Copy-Item artifacts/pip-tests.xml build/Checkpoint-Windows/docs/
          Copy-Item artifacts/nori-phone-verification.json build/Checkpoint-Windows/docs/
      - name: Check native session and play reminders
        run: |
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/review_session_design.py
          if ($LASTEXITCODE -ne 0) { throw 'Native session checks failed' }
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/review_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'CMA recap checks failed' }
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/review_play_support.py
          if ($LASTEXITCODE -ne 0) { throw 'Play reminder checks failed' }
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/review_widget.py
          if ($LASTEXITCODE -ne 0) { throw 'Nori widget checks failed' }
      - name: Check Windows updater restart and rollback
        run: |
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/smoke_windows_updates.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater restart/rollback fixtures failed' }
          Copy-Item artifacts/windows-updater-smoke.json build/Checkpoint-Windows/docs/
      - name: Check expression names, game-state vision and actual face provider
        run: |
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/review_expressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Expression and game-state checks failed' }
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/check_provider_face.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual provider face check failed' }
          Copy-Item artifacts/expression-review/verification.json build/Checkpoint-Windows/docs/
          Copy-Item artifacts/expression-review/provider-face-check.json build/Checkpoint-Windows/docs/
      - name: Build the visual case study PDF
        run: |
          python -m pip install playwright==1.65.2
          if ($LASTEXITCODE -ne 0) { throw 'PDF tooling install failed' }
          & ./build/Checkpoint-Windows/runtime/python.exe ./scripts/build_case_data.py
          if ($LASTEXITCODE -ne 0) { throw 'Case data export failed' }
          python -m scripts.build_release_case
          if ($LASTEXITCODE -ne 0) { throw 'Case study PDF failed' }
      - name: Package and verify archive
        run: |
          python -m scripts.package_windows
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          python -m scripts.package_app_update
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          python -m scripts.package_updater_repair
          if ($LASTEXITCODE -ne 0) { throw 'Updater repair package failed' }
          $hash = (Get-FileHash ../Checkpoint-Windows-Preview.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Checkpoint-Windows-Preview.zip" | Set-Content -Encoding ascii ../SHA256SUMS.txt
      - name: Preserve package and launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-windows-preview
          path: |
            topics/checkpoint/Checkpoint-Windows-Preview.zip
            topics/checkpoint/SHA256SUMS.txt
            topics/checkpoint/Regen-case-study.pdf
            topics/checkpoint/app/artifacts/design-review/widget-*.png
            topics/checkpoint/Checkpoint-App-Update.zip
            topics/checkpoint/Checkpoint-update.json
            topics/checkpoint/Checkpoint-Updater-Repair.zip
            topics/checkpoint/app/build/Checkpoint-Windows/windows-smoke.png
            topics/checkpoint/app/artifacts/windows-package-verification.json
            topics/checkpoint/app/artifacts/windows-tracking-smoke.json
            topics/checkpoint/app/artifacts/expression-review/
      - name: Publish downloadable Regen preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $tag = python -c "from checkpoint.version import RELEASE_TAG; print(RELEASE_TAG)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:RELEASE_COMMIT --prerelease --title 'Regen 0.6.4 - open UI and optional break reminders' --notes-file docs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag ../Checkpoint-Windows-Preview.zip ../SHA256SUMS.txt ../Checkpoint-App-Update.zip ../Checkpoint-Updater-Repair.zip ../Regen-case-study.pdf --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release upload $tag ../Checkpoint-update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest upload failed' }
